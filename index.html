<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <style>
        body { background: #0a0a0a; color: #00ff41; font-family: 'Courier New', Courier, monospace; display: flex; justify-content: center; padding-top: 50px; }
        .pipeline { width: 300px; border-left: 2px solid #333; padding-left: 20px; }
        .node { margin-bottom: 20px; }
        .label { font-size: 0.7rem; color: #888; text-transform: uppercase; }
        .value { font-size: 1.5rem; font-weight: bold; }
    </style>
</head>
<body>

<div class="pipeline">
    <div class="node"><div class="label">Fecha</div><div id="echa" class="value">-</div></div>
    <div class="node"><div class="label">Total Leads</div><div id="total_leads" class="value">0</div></div>
    <div class="node"><div class="label">Webs Válidas</div><div id="webs_validas" class="value">0</div></div>
    <div class="node"><div class="label">Emails Capturados</div><div id="emails_capturados" class="value">0</div></div>
    <div class="node"><div class="label">DNS OK</div><div id="dns_ok" class="value">0</div></div>
    <div class="node"><div class="label">Ratio Disparo</div><div id="ratio_disparo" class="value">0%</div></div>
</div>

<script>
    async function updateDashboard() {
        try {
            const res = await fetch('/api/get-kpi');
            const data = await res.json();
            
            document.getElementById('echa').innerText = data.Fecha;
            document.getElementById('total_leads').innerText = data.Total_Leads;
            document.getElementById('webs_validas').innerText = data.Webs_Válidas;
            document.getElementById('emails_capturados').innerText = data.Emails_Capturados;
            document.getElementById('dns_ok').innerText = data.DNS_OK;
            document.getElementById('ratio_disparo').innerText = data.Objetivos_Reales;
        } catch (e) { console.error("Error de pipeline:", e); }
    }
    updateDashboard();
</script>
</body>
</html>
